date: 2026-05-28

id: OSSA-2026-016

title: Neutron tagging policy bypass allows project readers to mutate tags

description: >
  Tim Shephard from roiai.ca reported a policy enforcement bypass
  in Neutron's tagging controller. The controller enforces plural
  policy action names on single-tag write operations while the
  defined policy rules use singular names. The mismatched names
  evaluate as allowed under default policy, permitting a project
  reader to create and update tags on same-project resources.
  Deployments running Neutron 26.0.0 or later are affected.

errata: 'When the original advisory was published a CVE number was not assigned. CVE-2026-49299 was assigned on 2026-05-28.'

affected-products:
  - product: neutron
    version: '>=26.0.0 <26.0.4, >=27.0.0 <27.0.3, >=28.0.0 <28.0.1'

