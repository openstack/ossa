notes:
  - 'The stable branch patches depend on two prerequisite backports
    (mDNS split-horizon pool scoping, Change 998005/998006 and their
    stable equivalents) that were merged before disclosure. Operators
    applying the fix to releases older than the next point release
    should ensure those prerequisite commits are present.'
  - 'Operators should audit existing zones for cross-tenant collisions
    that may have been created before the fix. A detection tool will
    be proposed as a separate public patch.'
