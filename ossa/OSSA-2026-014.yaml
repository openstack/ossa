date: 2026-05-27

id: OSSA-2026-014

title: Swift proxy-server denial of service via truncated s3api chunked upload

description: >
  Alistair Coles from NVIDIA reported a denial of service
  vulnerability in Swift's s3api middleware. An authenticated user
  can send a truncated aws-chunked PUT request that causes a
  proxy-server worker to enter an infinite loop, consuming CPU and
  memory until the process becomes permanently unresponsive.
  Deployments running Swift 2.35.1 or later with the s3api
  middleware enabled are affected.

errata: >
  The original advisory listed versions 2.36.0 and later as affected.
  Swift 2.35.1 and 2.35.2 (2025.1/epoxy) are also affected because
  aws-chunked support was backported to the 2025.1 branch.

affected-products:
  - product: swift
    version: '>=2.35.1 <2.35.3, >=2.36.0 <2.36.2, >=2.37.0 <2.37.2'

vulnerabilities:
