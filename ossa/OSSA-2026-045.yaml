date: 2026-10-20

id: OSSA-2026-045

title: Cross-project information disclosure in Cinder Messages API

description: |
  Yuliang Xiao, an independent reporter, and Chen YuXiang of the
  Institute of Computing Technology, Chinese Academy of Sciences independently
  reported a vulnerability in Cinder's messages API. A non-admin user
  with the project-scoped 'member' or 'reader' role making the Block
  Storage API v3.3 "List messages" call finds the non-expired user
  messages for other projects included in the response, resulting in
  the leakage of UUIDs of resources owned by other projects in addition
  to the user message about the other projects' resources (which, by
  design, are sanitized generic messages). All Cinder deployments are
  affected.

affected-products:
  - product: cinder
    version: '>=9.0.0 <26.3.1, ==27.0.0, ==28.0.0, ==29.0.0'

vulnerabilities:
  - cve-id: CVE-2026-93856

