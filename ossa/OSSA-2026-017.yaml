notes:
  - Releases 2024.1 (caracal) and 2023.1 (antelope) are unmaintained. Patches
    are provided as a courtesy. Releases 2023.2 (bobcat) and
    2024.2 (dalmation) are end of life and have not had patches provided. See
    https://releases.openstack.org for more information on supported releases.
  - Ironic bugfix branch patches will be available in git for interested
    operators. We will not perform an additional release from these branches.
  - This fix removes the ability to put some valid -- but unlikely -- special
    characters into kernel command line overrides. There is an escape hatch
    for impacted clouds; setting
    ``CONF.conductor.disable_kernel_parameter_parsing`` to true will restrict
    Ironic to only blocking the most dangerous, nonsensical special characters
    at the cost of being less security hardened against future attacks.

