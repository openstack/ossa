date: 2026-06-03

id: OSSA-2026-017

title: Script injection during node boot via linux command line override

description: >
  Dmitry Tantsur (Red Hat) and Tuomo Tanskanen (Ericsson Software Technology)
  from the Metal3.io Security Team reported a vulnerability in Ironic's
  kernel command line override code. A user with access to add or modify
  ``node.driver_info`` or ``node.instance_info`` can create a crafted value
  to enable iPXE script execution during the boot process.

affected-products:
  - product: ironic
    version: '>=17.0.0 <26.1.7, >=27.0.0 <29.0.6, >=30.0.0 <32.0.2, >=33.0.0 <35.0.2'

vulnerabilities:
