date: 2026-06-03

id: OSSA-2026-017

title: Script injection during node boot via linux command line override

description: >
  Dmitry Tantsur (Red Hat) and Tuomo Tanskanen (Ericsson Software Technology)
  from the Metal3.io Security Team reported a vulnerability in Ironic's
  kernel command line override code. A user with access to add or modify
  ``node.driver_info`` or ``node.instance_info`` can create a crafted value
  to enable iPXE script execution during the boot process.

errata: |
  The initial patches issued to address the vulnerability would erroneously
  reject some valid kernel parameters, particularly when URL encoded. These
  bugs had no detrimental security impact, but may have caused unexpected
  failures. We apologize for the inconvienience.

  Impacted operators should also apply the patches below labelled **errata 1**.
  For a more rapid resolution of failures, operators can set
  ``CONF.conductor.disable_kernel_parameter_parsing`` to false until they can
  apply the provided patches.

  **Both the patches labelled original and the patches labelled errata 1 should be
  applied for proper behavior.**

