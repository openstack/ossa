date: 2026-06-03

id: OSSA-2026-019

title: File Extraction from Ironic conductor via pxe_template

description: >
  Dmitry Tantsur (Red Hat) and Tuomo Tanskanen (Ericsson Software Technology)
  from the Metal3.io Security Team reported a vulnerability in Ironic's
  boot interfaces. A project owner or manager with access to modify
  ``node.driver_info[pxe_template]`` can set it to ``/etc/ironic/ironic.conf``
  or any other sensitive file readable by the conductor process. Ironic will
  then place this "template file" into a TFTP or HTTP server for netbooting,
  where it can be fetched by anything with network access to the conductor.

  Ironic intends on completely removing this feature in a future release.

