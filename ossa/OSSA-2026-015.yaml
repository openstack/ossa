date: 2026-05-28

id: OSSA-2026-015

title: Multiple credential delegation and authorization bypass vulnerabilities in Keystone

description: >
  Boris Bobrov from SAP SE reported that an authenticated attacker
  can inject RBAC policy targets via the JSON request body, bypassing
  authorization on any policy-protected endpoint to read credential
  secrets, create credentials for arbitrary users, and escalate to
  cloud admin (CVE-2026-42999). Application credential authentication
  does not verify the caller owns the credential, enabling user
  impersonation within a shared project (CVE-2026-42998). This
  impersonation can be chained with trusts to escalate from member
  to admin, with the resulting trust persisting independently
  (CVE-2026-43000). Tim Shepherd from roiai.ca reported that
  application credentials scoped to one project can create EC2
  credentials for a different project (CVE-2026-43001). Erichen
  from the Institute of Computing Technology, Chinese Academy of
  Sciences reported that federated users can maintain access
  indefinitely by repeatedly rescoping tokens before expiry, as each
  rescope issues a fresh full-TTL token instead of inheriting the
  original expiry (CVE-2026-44394). Additionally, Artem Goncharov
  from SysEleven GmbH identified related issues in trust-scoped token
  handling and policy enforcement during investigation. All
  Keystone deployments are affected; CVE-2026-44394 only affects
  SAML2/OIDC deployments.

affected-products:
  - product: keystone
    version: '>=14.0.0 <27.0.2, >=28.0.0 <28.0.2, >=29.0.0 <29.0.2'

