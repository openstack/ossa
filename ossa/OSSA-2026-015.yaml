notes:
  - The fix for CVE-2026-42999 modifies the trust policy structure.
    Deployments with customized trust policies may experience issues
    with image upload and Heat service functionality until the custom
    policy is updated.
  - CVE-2026-44394 only affects deployments using SAML2 or OIDC
    federation.
