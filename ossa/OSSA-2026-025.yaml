date: 2026-07-08

id: OSSA-2026-025

title: RBAC Bypass in IPMI Raw Command Execution

description: >
  Dmitry Tantsur (Red Hat) and Tuomo Tanskanen (Ericsson Software Technology)
  of the Metal3.io Security Team descovered a vulnerability around IPMI
  management_interface. A malicious user with access to deploy a node directly
  via Ironic can specify the IPMI `send_raw` deployment step with a malicious
  payload and send commands to that nodes' BMC.

  IPMI `send_raw` capability is exposed multiple ways, including via our
  VendorPassthru interfaces (restricted to system admin) and other step based
  flows such as cleaning or servicing. This also means any malicious user with
  the ability to initate manual cleaning and servicing flows with arbitrary
  steps can also execute this vulnerability.

  Operators can fix this issue by applying the provided patches which apply
  a blocklist forbidding use of the IPMI send_raw functionality in certain
  provisioning methods. Clouds currently using IPMI send_raw functionality
  should carefully review the behavior changes in the provided patches to
  ensure their workflows are not broken.

