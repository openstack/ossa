date: 2026-06-03

id: OSSA-2026-018

title: File overwrite on Ironic conductor via path traversal in ISO handling

description: >
  Dmitry Tantsur (Red Hat) and Tuomo Tanskanen (Ericsson Software Technology)
  from the Metal3.io Security Team reported a vulnerability in Ironic's
  ISO handling code. A maliciously crafted ISO image can cause Ironic to
  perform path traversal and overwrite files on a conductor's disk.

  Similarly, in the anaconda deploy interface, the same vulnerability can be
  exploited to perform path traversal and overwrite files on the target disk
  during deployment.

  Any Ironic user who has access to deploy nodes using configdrive, a virtual
  media-based boot interface or the anaconda deploy interface can exploit
  this issue.

