notes:
  - 'The two patch sets are interdependent and must be applied together.
    The token reauthentication guard introduced by the second patch
    depends on the delegation classification logic and the new
    ``[auth] additional_primary_auth_methods`` configuration option
    introduced by the first. Packaging or applying a subset is not
    supported.'

  - 'After upgrading, Keystone treats any authentication method not
    built in to Keystone as a delegated credential and rejects it from
    guarded operations (managing trusts, application credentials, and
    OAuth1 access tokens, and token reauthentication). Deployments
    running a custom or third-party authentication plugin must add it
    to ``[auth] additional_primary_auth_methods`` or those
    authentication flows will fail.'

  - 'This advisory does not address a related weakness in EC2 credential
    (``ec2credential``) handling, which is being tracked and fixed in
    public and will be covered by a separate OpenStack Security Note
    (OSSN).'

  - 'A related fix to the Keystone Tempest plugin test suite was
    proposed at https://review.opendev.org/1002296'

