date: 2026-11-17

id: OSSA-2026-052

title: keystonemiddleware ReDoS in AppCred access_rules processing

errata: >
  MITRE assigned CVE-2026-131922 for this vulnerability on 2026-11-18.

description: >
  Rock Xu reported a vulnerability in keystonemiddleware access rule path
  matching. By supplying a malicious regular expression when creating an
  application credential access_rules entry, an authenticated user may consume
  resources in the consuming process making a service unresponsive. All
  OpenStack service deployments may be affected.

affected-products:
  - product: keystonemiddleware
    version: '<10.13.1, >=11.0.0 <12.1.1, >=13.0.0 <13.0.3'

vulnerabilities:
  - cve-id: CVE-2026-131922

reporters:
  - name: Rock Xu

