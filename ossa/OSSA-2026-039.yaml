notes:
  - 'Two changes are required on each branch: one fixes the
    ``tls_ciphers`` fields and one fixes the L7 policy redirect
    fields.'

  - 'The listener and pool ``tls_ciphers`` fields were introduced in
    Octavia 6.0.0. Releases within the affected range that predate
    6.0.0 are vulnerable only through the L7 policy ``redirect_url``
    and ``redirect_prefix`` fields.'

  - 'These issues were originally triaged as a low-severity hardening
    opportunity and the fixes were developed and merged in public.
    They were reclassified after a proof of concept demonstrated
    remote code execution as root on the amphora and reachability of
    the control-plane network.'

  - 'The remote code execution issue was reported to the OpenStack
    VMT by Thomas Goirand (zigo) of Infomaniak, on behalf of the
    reporter, "Rolix".'

  - 'CVE identifiers were requested from MITRE for these two
    vulnerabilities on 2026-09-17. The CVEs will be added to this
    advisory by errata once assigned.'
