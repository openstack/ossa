date: 2026-06-03

id: OSSA-2026-020

title: Mistral policy enforcement bypass allows unauthorized public resource creation and arbitrary code execution

description: >
  Eduardo Gonzalez Gutierrez and Arnaud Morin (OVHcloud) reported
  that several Mistral API endpoints do not enforce access policies,
  allowing any authenticated user to create public resources and
  upload arbitrary code that executes on Mistral executor workers.
  An attacker could extract sensitive data including service
  credentials from the worker. Deployments exposing the Mistral
  API are affected.

affected-products:
  - product: mistral
    version: '>=20.0.0 <20.1.1, ==21.0.0, ==22.0.0'

