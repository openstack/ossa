date: 2026-11-19

id: OSSA-2026-053

title: Networking-Generic-Switch does not sanitize all inputs

description: >
  Jay Faulkner reported a vulnerability in Networking-Generic-Switch. By
  setting specially crafted metadata in an upstream service, such as Ironic,
  an authenticated user may compel Networking-Generic-Switch to execute
  arbitrary switch commands.

affected-products:
  - product: networking-generic-switch
    version: '<8.0.2, >=9.0.0 <9.1.2, >=10.0.0 <10.1.1, ==10.2.0'

vulnerabilities:
  - cve-id: CVE-2026-131919

reporters:
  - name: Jay Faulkner
    affiliation: G-Research OSS

issues:
  links:
    - https://launchpad.net/bugs/2163364

