notes:
  - Branches 2024.1/caracal and 2023.1/antelope are unmaintained
    and patches are provided as a courtesy.
  - Bugfix branches will receive patches in git but will not receive an
    updated release.
  - While root access to a node running an Ironic workflow has security
    implications for that specific node, there is no known method for turning
    node ramdisk shell access into a full compromise of the Ironic service.

