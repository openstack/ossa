notes:
  - The vulnerable code path has existed since Ironic 9.0.0 (OpenStack Pike),
    however, this could only be considered an escalation of privileges after
    Ironic 17.0.0 (OpenStack Wallaby), when Ironic introduced the ability for
    project-scoped users to interact via the owner/lessee model.
  - Branches for 2024.1 (caracal) and 2023.1 (antelope) are unmaintained.
    Patches are provided as a courtesy. Releases 2023.2 (bobcat) and
    2024.2 (dalmatian) are end of life and have not had patches provided. See
    https://releases.openstack.org for more information on supported releases.
  - Ironic bugfix branch patches will be available in git for interested
    operators. We will not perform an additional release from these branches.
