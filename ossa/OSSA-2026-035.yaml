date: 2026-08-13

id: OSSA-2026-035

title: Unauthorized QoS policy deletion lock

description: >
  Chen YuXiang with the Institute of Computing Technology, Chinese Academy of
  Sciences, reported a vulnerability in Octavia quality of service (QoS) policy
  authorization. By associating another project's QoS policy with an amphora,
  an authenticated user may prevent deletion of that policy. All Octavia
  deployments are affected.

errata: >
  MITRE assigned CVE-2026-74248 after intial publication.

affected-products:
  - product: Octavia
    version: '<16.0.2, ==17.0.0, ==18.0.0'

