notes:
  - A CVE request was filed with MITRE on 2026-04-27.
  - Patches for unmaintained branches are provided as a courtesy.
  - The ``ipmitool-shellinabox`` console interface is already scheduled
    for removal from Ironic for lack of security support for shellinabox.
    Security sensitive operators are strongly encouraged to stop use of this
    console interface immediately.
  - '**Errata 2** The console regression affects the 26.1.6, 29.0.5, 29.0.6, 32.0.1,
    35.0.1, 36.0.0, 37.0.0 and 38.0.0 releases; stable/2024.2 has since
    been retired, so 26.1.6 can only be corrected by applying the
    additional fix locally.'
 
